name: citrus-gate-node
services:
  node:
    image: citrus-gate:1.0
    network_mode: host
    restart: unless-stopped
    user: "65532:65532"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,size=64m"]
    entrypoint: ["/usr/local/bin/mikan-node"]
    environment:
      MIKAN_DATA_DIR: /data/node
      MIKAN_NODE_SOCKET: /run/mikan/node.sock
      MIKAN_NODE_JOIN: ${MIKAN_NODE_JOIN}
    volumes: ["./data/node:/data/node", "run:/run/mikan"]
    pids_limit: 1024
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  run: {}
